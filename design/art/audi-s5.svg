@keyframes s5-headlight{0%,59%,100%{opacity:.75}66%,76%{opacity:1}}
@media(prefers-reduced-motion:reduce){.s5-trace .s5-contour-pass,.s5-trace .s5-polish{animation:none;opacity:0}.s5-trace .s5-headlight{animation:none;opacity:.85}}
</style>
