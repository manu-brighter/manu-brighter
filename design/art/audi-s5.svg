<svg xmlns="http://www.w3.org/2000/svg" class="s5-trace" viewBox="0 0 1575 610" role="img" aria-labelledby="s5-title s5-desc">
<title id="s5-title">My S5, in profile</title>
<desc id="s5-desc">Right-facing Audi S5 B8.5 coupe in side-profile line art. Lowered suspension, slim tyres on large polished five-split-Y wheels, silver mirrors and a raised boot-lip spoiler. Light travels over the body and polished wheels while the car stays still.</desc>
<defs>
