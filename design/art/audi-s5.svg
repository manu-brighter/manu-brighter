<style>
.s5-trace .s5-contour-pass{stroke-dasharray:150 1250;stroke-dashoffset:160;opacity:0;animation:s5-contour-pass 12s ease-in-out infinite}
.s5-trace .s5-shoulder-pass{animation-delay:1.1s}
.s5-trace .s5-polish{opacity:0;animation:s5-polish-pass 12s ease-in-out infinite}
.s5-trace .s5-polish-front{animation-delay:3.7s}
.s5-trace .s5-headlight{opacity:.75;animation:s5-headlight 12s ease-in-out infinite}
@keyframes s5-contour-pass{0%,10%{stroke-dashoffset:160;opacity:0}17%{opacity:.95}64%{stroke-dashoffset:-1000;opacity:.95}70%,100%{stroke-dashoffset:-1000;opacity:0}}
