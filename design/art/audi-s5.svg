<linearGradient id="s5-light" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#9b78ff"/><stop offset=".54" stop-color="#e9ddff"/><stop offset="1" stop-color="#dcff6b"/></linearGradient>
