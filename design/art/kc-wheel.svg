<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" class="audi-s5-wheel" role="img" aria-labelledby="as5-kc-title as5-kc-desc">
<title id="as5-kc-title">KC Forged — polished twenty-inch split-Y wheel.</title>
<desc id="as5-kc-desc">A detailed front view of Manuel's polished KC Forged wheel: ten slender branched spokes, a deep stepped lip, exposed perimeter bolts, five wheel bolts and a KC centre emblem. The black S5 brake caliper is visible through the spokes. Violet and lime appear only as studio reflections in the chrome. The wheel stays still.</desc>
